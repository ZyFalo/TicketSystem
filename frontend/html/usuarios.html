<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Gestión de Usuarios</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <nav class="main-nav">
    <a href="/" class="nav-brand">DevSupport</a>
    <div class="nav-links" id="nav-links">
      <a href="/tickets">Tickets</a>
      <a href="/tickets?mis=true" id="nav-mis-tickets" style="display:none;">Mis Tickets</a>
      <a href="/crear" id="nav-crear" style="display:none;">Nuevo Ticket</a>
      <a href="/usuarios" id="nav-usuarios" style="display:none;">Usuarios</a>
      <a href="/login" id="nav-auth-link">Login</a>
    </div>
  </nav>

  <main class="container">
    <h2>Gestión de Usuarios</h2>
    <div id="usuarios-error" style="color: red; margin-bottom: 1rem;"></div>

    <div class="tickets-table-container">
      <table class="tickets-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="usuarios-body">
          <tr>
            <td colspan="5" style="text-align: center; color: #6b7280; padding: 2rem;">Cargando usuarios...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="/static/js/nav.js"></script>
  <script type="module" src="/static/js/usuarios.js"></script>
</body>
</html>
