<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Gestión de Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <script type="module" src="/static/js/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">DevSupport</a>
    <div class="nav-links" id="nav-links">
      <a href="/tickets" class="nav-link">Tickets</a>
      <a href="/tickets?mis=true" class="nav-link" id="nav-mis-tickets" hidden>Mis Tickets</a>
      <a href="/crear" class="nav-link" id="nav-crear" hidden>Nuevo Ticket</a>
      <a href="/usuarios" class="nav-link" id="nav-usuarios" hidden>Usuarios</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema"></button>
      <a href="/login" class="nav-user" id="nav-auth-link">Login</a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <a href="/tickets" class="nav-link">Tickets</a>
    <a href="/tickets?mis=true" class="nav-link" id="nav-mis-tickets-m" hidden>Mis Tickets</a>
    <a href="/crear" class="nav-link" id="nav-crear-m" hidden>Nuevo Ticket</a>
    <a href="/usuarios" class="nav-link" id="nav-usuarios-m" hidden>Usuarios</a>
    <a href="#" class="nav-link nav-logout-mobile" id="nav-logout-m" hidden>Cerrar sesion</a>
  </div>

  <main>
    <div class="container">
      <div class="main-content">
        <!-- Breadcrumbs -->
        <nav class="breadcrumbs">
          <a href="/tickets">Tickets</a>
          <span class="breadcrumb-separator">/</span>
          <span>Usuarios</span>
        </nav>

        <h2>Gestión de Usuarios</h2>

        <div id="usuarios-error" class="form-error"></div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="usuarios-body">
              <tr class="skeleton-row">
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
              </tr>
              <tr class="skeleton-row">
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
              </tr>
              <tr class="skeleton-row">
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
                <td><div class="skeleton-cell"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/nav.js"></script>
  <script type="module" src="/static/js/usuarios.js"></script>
</body>
</html>
