<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Listado</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <a href="/" class="nav-brand">DevSupport</a>
    <div class="nav-links" id="nav-links">
      <a href="/tickets">Tickets</a>
      <a href="/tickets?mis=true" id="nav-mis-tickets" style="display:none;">Mis Tickets</a>
      <a href="/crear" id="nav-crear" style="display:none;">Nuevo Ticket</a>
      <a href="/usuarios" id="nav-usuarios" style="display:none;">Usuarios</a>
    </div>
    <div class="nav-bottom">
      <a href="/login" id="nav-auth-link">Login</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex justify-between items-center mb-md">
      <h2>Listado de Tickets</h2>
      <a href="/crear" class="btn btn-primary" id="btn-nuevo-ticket" style="display:none;">Nuevo Ticket</a>
    </div>

    <!-- Filtros -->
    <div class="card card-compact mb-lg">
      <form id="filtros-form" class="filters-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="filtro-estado">Estado</label>
          <select id="filtro-estado" class="form-control" style="min-width: 150px;">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="filtro-prioridad">Prioridad</label>
          <select id="filtro-prioridad" class="form-control" style="min-width: 150px;">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="filtro-categoria">Categoría</label>
          <select id="filtro-categoria" class="form-control" style="min-width: 150px;">
            <option value="">Todas</option>
          </select>
        </div>
        <div id="filtro-mis-tickets-container" class="form-group" style="margin-bottom: 0; display: none; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="filtro-mis-tickets">
          <label for="filtro-mis-tickets" style="margin: 0; font-weight: 500;">Mis tickets</label>
        </div>
        <div style="margin-top: auto; padding-bottom: 2px;">
          <button type="submit" class="btn btn-secondary">Filtrar</button>
          <button type="button" id="btn-limpiar" class="btn" style="background: none; color: #2563eb;">Limpiar</button>
        </div>
      </form>
    </div>

    <div id="tickets-error" style="color: red; margin-bottom: 1rem;"></div>

    <!-- Tabla -->
    <div class="tickets-table-container">
      <table class="tickets-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Categoría</th>
            <th>Estado</th>
            <th>Prioridad</th>
            <th>Creador</th>
            <th>Asignados</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tickets-body">
          <tr>
            <td colspan="9" style="text-align: center; color: #6b7280; padding: 2rem;">Cargando tickets...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

  <script type="module" src="/static/js/nav.js"></script>
  <script type="module" src="/static/js/tickets.js"></script>
</body>
</html>
