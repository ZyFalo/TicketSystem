<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <script type="module" src="/static/js/theme.js"></script>
</head>
<body>
  <main class="centered-view">
    <a href="/" class="nav-brand display-heading">DevSupport</a>

    <div class="login-form-wrapper">
      <!-- Login Panel -->
      <div id="login-section" class="card login-panel is-visible">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" class="form-control" required>
          </div>
          <div id="login-error" class="form-error"></div>
          <div class="btn-full-width">
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
        <div class="login-toggle-text">
          ¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a>
        </div>
      </div>

      <!-- Register Panel -->
      <div id="register-section" class="card login-panel is-hidden">
        <h2>Registro</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Nombre</label>
            <input type="text" id="reg-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" class="form-control" required>
          </div>
          <div id="register-error" class="form-error"></div>
          <div class="btn-full-width">
            <button type="submit" class="btn btn-secondary">Registrarme</button>
          </div>
        </form>
        <div class="login-toggle-text">
          ¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/auth.js"></script>
  <script type="module" src="/static/js/nav.js"></script>
</body>
</html>
