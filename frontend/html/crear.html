<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Crear Ticket</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <a href="/" class="nav-brand">DevSupport</a>
    <div class="nav-links" id="nav-links">
      <a href="/tickets">Tickets</a>
      <a href="/tickets?mis=true" id="nav-mis-tickets" style="display:none;">Mis Tickets</a>
      <a href="/crear" id="nav-crear" style="display:none;">Nuevo Ticket</a>
      <a href="/usuarios" id="nav-usuarios" style="display:none;">Usuarios</a>
    </div>
    <div class="nav-bottom">
      <a href="/login" id="nav-auth-link">Login</a>
    </div>
  </aside>

  <main class="main-content" style="max-width: 800px; margin: 0 auto; margin-left: auto;">
    <h2>Crear Nuevo Ticket</h2>
    
    <div class="card my-lg">
      <form id="crear-ticket-form">
        <div class="form-group">
          <label for="titulo">Título del problema</label>
          <input type="text" id="titulo" class="form-control" required placeholder="Ej. El servidor devuelve error 500 al guardar">
        </div>

        <div id="campos-clasificacion" class="flex gap-md" style="display:none;">
          <div class="form-group" style="flex: 1;">
            <label for="categoria">Categoría</label>
            <select id="categoria" class="form-control">
              <option value="">Selecciona...</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad" class="form-control">
              <option value="">Selecciona...</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción detallada</label>
          <textarea id="descripcion" class="form-control" required placeholder="Describe los pasos para reproducir, lo que esperabas que pasara y lo que pasó..."></textarea>
        </div>

        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border-color);">
        
        <h3>Fragmento de Código (Opcional)</h3>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">Si el problema es específico de código, pégalo aquí para revisión técnica.</p>

        <div class="form-group">
          <label for="lenguaje">Lenguaje</label>
          <select id="lenguaje" class="form-control" style="max-width: 200px;">
            <option value="javascript">JavaScript / Node.js</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="html">HTML / CSS</option>
            <option value="sql">SQL</option>
            <option value="plaintext">Texto plano</option>
          </select>
        </div>

        <div class="form-group">
          <label for="codigo">Código</label>
          <textarea id="codigo" class="form-control" style="font-family: monospace; min-height: 150px; background-color: #f9fafb;" placeholder="function ejemplo() { ... }"></textarea>
        </div>

        <div id="seccion-asignados" style="display:none;">
          <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border-color);">

          <h3>Asignar Responsables (Opcional)</h3>
          <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">Selecciona los desarrolladores que trabajarán en este ticket.</p>
          <div id="asignados-checkboxes" style="max-height: 200px; overflow-y: auto;"></div>
        </div>

        <div id="crear-error" style="color: red; font-size: 0.875rem; margin-bottom: 1rem; margin-top: 1rem;"></div>

        <div class="flex justify-between items-center mt-md">
          <a href="/tickets" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" id="btn-submit">Crear Ticket</button>
        </div>
      </form>
    </div>
  </main>
</div>

  <script type="module" src="/static/js/crear.js"></script>
  <script type="module" src="/static/js/nav.js"></script>
</body>
</html>
