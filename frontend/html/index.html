<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Inicio</title>
  <link rel="stylesheet" href="/static/css/main.css"> <!-- Se asume compilación SCSS -->
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <a href="/" class="nav-brand">DevSupport</a>
    <div class="nav-links" id="nav-links">
      <a href="/tickets">Tickets</a>
      <a href="/tickets?mis=true" id="nav-mis-tickets" style="display:none;">Mis Tickets</a>

      <div class="flex gap-md mt-md">
        <a href="/login" class="btn btn-primary" id="btn-crear-landing">Crear Ticket</a>

  <script type="module" src="/static/js/nav.js"></script>
